# Empêche la mise en pause automatique du projet Supabase.
#
# Le plan gratuit Supabase met un projet en pause après ~7 jours sans activité
# réelle en base. Une simple LECTURE ne suffit pas : les policies RLS bloquent
# la lecture anonyme (résultat vide) et Supabase ne la compte pas comme activité.
# Ce workflow fait donc une ÉCRITURE réelle chaque jour : il met à jour la ligne
# unique de la table dédiée `keepalive` (créée à la main via l'éditeur SQL, avec
# une policy autorisant l'UPDATE anonyme sur id = 1). Une écriture compte à coup
# sûr comme activité → le projet ne se met plus en pause.
#
# Bonus : si l'écriture échoue, le job échoue et GitHub envoie un email —
# ça sert donc aussi de surveillance basique de la santé du backend.
#
# La clé utilisée est la "publishable key" (sb_publishable_*), conçue pour être
# publique : elle est déjà dans le bundle frontend et dans src/supabase.js.
# La sécurité repose sur les policies RLS côté Supabase.

name: Keep-alive Supabase

on:
  schedule:
    - cron: '0 6 * * *' # ping Supabase — tous les jours 06:00 UTC
    - cron: '0 5 1 * *' # 1er du mois — commit pour garder le repo actif
  workflow_dispatch: # permet de le lancer à la main depuis l'onglet Actions

permissions:
  contents: write

env:
  SUPABASE_URL: https://mwiottnkuigxwuyojuox.supabase.co
  SUPABASE_KEY: sb_publishable_Aa3lTLaAruzJhds_VxpoNQ_Bc6bhQaE

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat Supabase (écriture réelle)
        run: |
          ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          status=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
            -X PATCH \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data "{\"last_ping\":\"$ts\"}" \
            "$SUPABASE_URL/rest/v1/keepalive?id=eq.1")
          echo "HTTP $status"
          cat /tmp/body.txt
          if [ "$status" != "200" ]; then
            echo "::error::Heartbeat KO ($status) — table keepalive absente ou projet en pause ?"
            exit 1
          fi
          # Une réponse contenant last_ping prouve qu'une ligne a bien été mise à jour.
          if ! grep -q 'last_ping' /tmp/body.txt; then
            echo "::error::Aucune ligne mise à jour — vérifier la table keepalive et la policy anon UPDATE (id = 1)."
            exit 1
          fi
          echo "Heartbeat OK — activité écrite en base."

      # GitHub désactive les workflows planifiés sur un dépôt resté 60 jours sans
      # aucun commit. Ce commit mensuel garde le dépôt "actif" et évite ça.
      - name: Checkout
        if: github.event.schedule == '0 5 1 * *'
        uses: actions/checkout@v4

      - name: Commit mensuel d'activité
        if: github.event.schedule == '0 5 1 * *'
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-keepalive.txt
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/last-keepalive.txt
          git commit -m 'chore: keep-alive mensuel (repo + Supabase)' || exit 0
          git push
